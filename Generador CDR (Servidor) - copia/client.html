<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de CDRs</title>
<style>
  :root{--blue:#3A82C7;--blue-d:#264F86;--blue-l:#5AA0E0;--ink:#15375A;--sub:#7890A8;--border:#D2E2F4;--card:#FFFFFF;--ok:#2E7D5B;--err:#C0392B;--field:#F4FAFF;--orange:#E67E22;--orange-d:#C9640F;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,#E9F2FC 0%,#D3E4F6 45%,#DCE9F7 100%);background-size:180% 180%;animation:bgshift 18s ease infinite;padding:30px 14px 48px;}
  @keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .wrap{max-width:780px;margin:0 auto;}
  .app{background:var(--card);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 30px 70px rgba(24,70,130,.28),0 6px 14px rgba(24,70,130,.10);}
  .app::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#5AA0E0,#264F86 50%,#E67E22);}
  .header{background:linear-gradient(135deg,#5AA0E0 0%,#234B82 100%);padding:24px 28px;color:#fff;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;}
  .header::after{content:"";position:absolute;inset:0;background:radial-gradient(500px 150px at 15% -10%,rgba(255,255,255,.25),rgba(255,255,255,0) 70%);}
  .logo{width:52px;height:52px;flex:0 0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));position:relative;}
  .header h1{margin:0;font-size:23px;letter-spacing:.3px;position:relative;font-weight:700;}
  .header p{margin:4px 0 0;font-size:13px;color:#DCEAFB;position:relative;}
  .body{padding:26px 28px 28px;}
  .lbl{font-size:11.5px;font-weight:800;color:var(--blue-d);text-transform:uppercase;letter-spacing:.9px;margin:0 0 10px;display:flex;align-items:center;gap:7px;}
  .seg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:700;background:#E9F2FC;color:#3E6C99;transition:transform .12s cubic-bezier(.3,1.4,.5,1),box-shadow .18s,background .18s;box-shadow:0 2px 6px rgba(24,70,130,.10);}
  .pill svg{width:16px;height:16px;}
  .pill:hover{transform:translateY(-2px);background:#DDEBF9;}
  .pill.on{background:linear-gradient(135deg,var(--blue-l),var(--blue-d));color:#fff;box-shadow:0 8px 18px rgba(38,79,134,.45),inset 0 1px 0 rgba(255,255,255,.28);transform:translateY(-2px);}
  .pill.on.roam{background:linear-gradient(135deg,#F0A050,var(--orange-d));box-shadow:0 8px 18px rgba(38,79,134,.45),inset 0 1px 0 rgba(255,255,255,.28);}
  .card{background:linear-gradient(180deg,#FFFFFF,#F8FCFF);border:1px solid var(--border);border-radius:16px;padding:22px 22px 12px;box-shadow:0 10px 26px rgba(24,70,130,.10);margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:4px 20px;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .field{display:flex;flex-direction:column;margin-bottom:15px;animation:fadeInUp .28s ease both;position:relative;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--sub);margin-top:4px;}
  .req{color:var(--orange-d);font-weight:800;}
  .inrow{display:flex;gap:6px;}
  input,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1.5px solid var(--border);border-radius:11px;padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s,background .15s;outline:none;box-shadow:inset 0 1px 2px rgba(24,70,130,.05);}
  input::placeholder{color:#A9BED6;}
  input:hover,select:hover{background:#fff;}
  input:focus,select:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(58,130,199,.18);}
  .lupa{flex:0 0 auto;width:44px;border:1.5px solid var(--border);background:#E9F2FC;border-radius:11px;cursor:pointer;color:var(--blue-d);display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;}
  .lupa:hover{background:#DAEAF8;transform:translateY(-1px);}
  .lupa svg{width:18px;height:18px;}
  .unitsel{flex:0 0 auto;width:auto;min-width:60px;padding-left:8px;padding-right:6px;font-weight:600;}
  .picker{position:absolute;left:0;right:0;top:100%;z-index:50;background:#fff;border:1.5px solid var(--blue);border-radius:12px;box-shadow:0 14px 34px rgba(24,70,130,.28);margin-top:4px;overflow:hidden;}
  .picksearch{border:none;border-bottom:1px solid var(--border);border-radius:0;box-shadow:none;padding:11px 13px;}
  .picksearch:focus{box-shadow:none;border-bottom:1px solid var(--blue);}
  .picklist{max-height:230px;overflow-y:auto;}
  .pickitem{padding:9px 13px;font-size:13px;cursor:pointer;border-bottom:1px solid #F0F5FB;}
  .pickitem:hover{background:#E9F2FC;}
  .pickitem b{color:var(--ink);}
  .pickitem .dim{color:var(--sub);font-size:11.5px;}
  .picknone{padding:12px;color:var(--sub);font-size:12px;text-align:center;}
  .nota{grid-column:1/-1;font-size:11.5px;color:var(--sub);font-style:italic;padding:2px 0 8px;}
  .actions{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:14px 28px;transition:transform .12s,box-shadow .18s,filter .18s;}
  .btn-primary{position:relative;overflow:hidden;background:linear-gradient(135deg,#4E96DD,#234B82);color:#fff;box-shadow:0 10px 22px rgba(38,79,134,.45),inset 0 1px 0 rgba(255,255,255,.3);}
  .btn-primary::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s;}
  .btn-primary:hover{transform:translateY(-2px);filter:brightness(1.07);}
  .btn-primary:hover::after{left:130%;}
  .btn-primary:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(38,79,134,.4);}
  .btn-ghost{background:#E9F2FC;color:var(--blue-d);box-shadow:0 2px 6px rgba(24,70,130,.12);}
  .btn-ghost:hover{transform:translateY(-2px);background:#DDEBF9;}
  .status{font-size:13.5px;font-weight:700;margin:8px 2px 0;min-height:20px;}
  .status.ok{color:var(--ok);}.status.err{color:var(--err);}
  .result{margin-top:16px;animation:fadeInUp .32s ease both;}
  .result .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .meta{font-size:12.5px;color:var(--sub);line-height:1.7;background:#F4FAFF;border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:9px;}
  .meta b{color:var(--ink);}
  pre.line{background:#0D2032;color:#CFE6FA;font-family:Consolas,"Courier New",monospace;font-size:12px;padding:14px;border-radius:11px;overflow-x:auto;white-space:pre;margin:0;box-shadow:inset 0 2px 10px rgba(0,0,0,.34);}
  .pathwrap{margin-top:24px;border-top:1px dashed var(--border);padding-top:20px;}
  .pathbar{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#11283C,#0B1D2C);border-radius:12px;padding:13px 13px 13px 16px;box-shadow:inset 0 2px 10px rgba(0,0,0,.36);transition:box-shadow .3s;}
  .pathbar.flash{box-shadow:0 0 0 3px rgba(90,160,224,.6),inset 0 2px 10px rgba(0,0,0,.36);}
  .pathbar .ico{flex:0 0 auto;color:#7FC0FF;}
  .pathbar code{flex:1;color:#DCEBFA;font-family:Consolas,"Courier New",monospace;font-size:13px;word-break:break-all;user-select:all;}
  .copybtn{flex:0 0 auto;border:none;cursor:pointer;background:#2E6BA6;color:#fff;font-weight:700;font-size:12px;border-radius:9px;padding:10px 15px;transition:background .15s,transform .12s;}
  .copybtn:hover{background:#3A82C7;transform:translateY(-1px);}
  .loginwrap{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#234B82,#0B1D2C);display:flex;align-items:center;justify-content:center;padding:20px;}
  .loginbox{background:#fff;border-radius:20px;padding:28px 26px;width:100%;max-width:360px;box-shadow:0 30px 70px rgba(0,0,0,.42);text-align:center;animation:fadeInUp .3s ease both;}
  .loginbox h2{margin:10px 0 2px;font-size:20px;color:var(--ink);}
  .loginbox .lsub{margin:0 0 18px;font-size:14px;color:var(--sub);font-weight:700;}
  .loginbox input{margin-bottom:10px;text-align:left;}
  .lgerr{color:var(--err);font-size:12.5px;min-height:16px;margin-bottom:6px;text-align:left;}
  .lgdiv{display:flex;align-items:center;color:var(--sub);font-size:12px;margin:14px 0;}
  .lgdiv::before,.lgdiv::after{content:"";flex:1;height:1px;background:var(--border);}
  .lgdiv span{padding:0 10px;}
  .lnote{font-size:11.5px;color:var(--sub);margin:16px 0 0;line-height:1.5;}
  body.locked .wrap{display:none;}
</style>
</head>
